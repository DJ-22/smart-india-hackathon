<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoiceGuard Live Call</title>

    <!-- LiveKit Client SDK -->
    <script src="https://unpkg.com/livekit-client@2.9.0/dist/livekit-client.umd.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #0f1117;
            color: #f5f7fa;
        }

        .call-container {
            width: 100%;
            min-height: 430px;

            padding: 20px;

            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header */

        .call-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 13px;
            color: #aeb5c2;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #777;
        }

        .status-dot.live {
            background: #ff4b4b;

            box-shadow:
                0 0 10px rgba(255, 75, 75, 0.6);
        }

        /* Participants */

        .participants {
            flex: 1;

            min-height: 280px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 14px;
        }

        .participant {
            position: relative;

            min-height: 240px;

            border-radius: 14px;

            background: #181b24;

            border: 1px solid #292e3a;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* Video */

        .participant video {
            width: 100%;
            height: 100%;

            object-fit: cover;

            position: absolute;

            inset: 0;
        }

        /* Avatar */

        .avatar {
            width: 72px;
            height: 72px;

            border-radius: 50%;

            background: #303644;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        /* Participant name */

        .participant-name {
            position: absolute;

            left: 12px;
            bottom: 12px;

            background:
                rgba(0, 0, 0, 0.55);

            padding: 6px 10px;

            border-radius: 7px;

            font-size: 13px;
        }

        /* Speaking indicator */

        .speaking {
            border: 2px solid #35d07f;

            box-shadow:
                0 0 18px rgba(
                    53,
                    208,
                    127,
                    0.25
                );
        }

        /* Controls */

        .controls {
            display: flex;

            justify-content: center;

            gap: 10px;
        }

        button {
            border: 0;

            border-radius: 9px;

            padding: 10px 16px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            background: #292e3a;

            color: white;
        }

        button:hover {
            background: #383f4d;
        }

        #leave-btn {
            background: #b3261e;
        }

        #leave-btn:hover {
            background: #d32f2f;
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .message {
            text-align: center;

            color: #aeb5c2;

            font-size: 13px;

            margin-top: 12px;
        }
    </style>
</head>

<body>

<div class="call-container">

    <!-- Header -->

    <div class="call-header">

        <div class="title">
            📞 Live Call
        </div>

        <div class="status">

            <span
                id="status-dot"
                class="status-dot">
            </span>

            <span id="status-text">
                Connecting...
            </span>

        </div>

    </div>


    <!-- Participants -->

    <div
        id="participants"
        class="participants">

        <div
            id="empty-state"
            class="participant">

            <div>

                <div class="avatar">
                    👤
                </div>

                <div class="message">
                    Waiting for participant...
                </div>

            </div>

        </div>

    </div>


    <!-- Controls -->

    <div class="controls">

        <button id="mute-btn">
            🎤 Mute
        </button>

        <button id="leave-btn">
            📞 End Call
        </button>

    </div>

</div>


<script src="https://unpkg.com/livekit-client@2.9.0/dist/livekit-client.umd.js"></script>
<script src="./app.js"></script></body>
</html>
